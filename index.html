<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Negeri Rasa, Budaya &amp; Kopi – Solok Selatan</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf4e4;--panel:#fffdf7;--ink:#4a2f27;--mute:#8a6f63;--accent:#b5432f;--line:#ecdcc0;--c1:#5f8f3e;--c2:#3b7ea1;--c3:#8a5a3b;--c4:#b5432f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a16;--panel:#32241e;--ink:#f6e9d3;--mute:#c4a994;--accent:#e2735c;--line:#4d3a30;--c1:#8fbb67;--c2:#6fb4d6;--c3:#c9966d;--c4:#e2735c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241a16;--panel:#32241e;--ink:#f6e9d3;--mute:#c4a994;--accent:#e2735c;--line:#4d3a30;--c1:#8fbb67;--c2:#6fb4d6;--c3:#c9966d;--c4:#e2735c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lora,Georgia,serif;line-height:1.5}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-family:Caveat,cursive;font-size:24px;color:var(--accent);line-height:1}
.logo small{display:block;font-family:Lora,serif;font-size:8px;letter-spacing:.22em;color:var(--mute)}
.pill{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;white-space:nowrap}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.hero{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.hero{grid-template-columns:240px 1fr}}
.scene{display:flex;flex-direction:column;align-items:center}
.scene svg{width:min(200px,60%);height:auto}
.scene p{font-family:Caveat,cursive;font-size:22px;color:var(--accent);margin:4px 0 0;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(120,70,40,.08)}
h1{font-family:Caveat,cursive;font-weight:600;color:var(--accent);margin:0 0 2px;font-size:38px;line-height:1.1}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.tabs,.subs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.subs .chip{font-size:12px;padding:4px 11px}
.q{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:9px 16px;font:inherit;font-size:14px;margin-bottom:12px}
.mapbox{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:6px;margin-bottom:12px}
.mapbox svg{width:100%;height:auto;display:block}
.cap{font-size:12px;color:var(--mute);text-align:center;min-height:18px;margin:2px 0 0}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);cursor:pointer}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.item b{font-size:14px;display:block}
.item .m{font-size:12px;color:var(--mute);margin-top:2px}
.item .r{color:var(--accent);font-weight:600}
.item a{font-size:12px;color:var(--accent)}
.more{display:block;margin:14px auto 0}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:16px}
footer{text-align:center;color:var(--mute);font-size:12px;padding:24px 16px 32px}
/* ===== pernak-pernik 3D ===== */
.scene{perspective:700px;position:relative}
.stage{width:100%;display:flex;justify-content:center;transform-style:preserve-3d;transition:transform .15s ease-out}
.sway{position:relative;width:100%;display:flex;justify-content:center;transform-style:preserve-3d;animation:sway 8s ease-in-out infinite}
.sway svg{filter:drop-shadow(0 16px 12px rgba(80,40,20,.28))}
@keyframes sway{0%,100%{transform:rotateY(-6deg) rotateX(2deg)}50%{transform:rotateY(6deg) rotateX(-2deg)}}
.bean{position:absolute;width:22px;height:32px;border-radius:50%/60% 60% 40% 40%;background:radial-gradient(circle at 30% 25%,#b07a52,#6b3f26 55%,#3d2214);box-shadow:inset -3px -4px 6px rgba(0,0,0,.35),0 10px 10px rgba(0,0,0,.22);animation:fl 5s ease-in-out infinite;transform-style:preserve-3d;pointer-events:none}
.bean::after{content:"";position:absolute;left:calc(50% - 3px);top:10%;bottom:10%;width:6px;border-left:2px solid #2a160c;border-radius:50% 0 0 50%}
.b1{left:3%;top:16%;--z:60px;--r:-20deg}
.b2{right:5%;top:6%;--z:-30px;--r:25deg;width:16px;height:24px;animation-delay:-1.5s}
.b3{left:7%;bottom:22%;--z:80px;--r:10deg;animation-delay:-3s}
.b4{right:2%;bottom:30%;--z:40px;--r:-35deg;width:18px;height:27px;animation-delay:-2s}
.leaf{position:absolute;left:42%;top:2%;width:28px;height:15px;background:linear-gradient(135deg,#9bc86f,#4f7f34);border-radius:0 100% 0 100%;box-shadow:0 8px 8px rgba(0,0,0,.2);animation:fl 6s ease-in-out infinite;--z:70px;--r:-15deg;pointer-events:none}
@keyframes fl{0%,100%{transform:translate3d(0,0,var(--z)) rotate(var(--r)) rotateY(0)}50%{transform:translate3d(0,-12px,var(--z)) rotate(var(--r)) rotateY(180deg)}}
.logo,h1{text-shadow:0 1px 0 rgba(90,25,15,.55),0 2px 0 rgba(90,25,15,.45),0 3px 0 rgba(90,25,15,.35),0 6px 8px rgba(0,0,0,.22)}
.logo{text-shadow:0 1px 0 rgba(90,25,15,.5),0 2px 0 rgba(90,25,15,.35),0 4px 5px rgba(0,0,0,.2)}
.logo small{text-shadow:none}
.panel{box-shadow:0 10px 0 -6px var(--line),0 20px 32px rgba(120,70,40,.16)}
.chip{box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.chip.on{box-shadow:0 3px 0 rgba(0,0,0,.28)}
.chip:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.list{perspective:900px}
.item{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s,box-shadow .2s;box-shadow:0 3px 0 var(--line),0 10px 16px rgba(120,70,40,.1)}
.item:hover{box-shadow:0 5px 0 var(--line),0 16px 22px rgba(120,70,40,.18)}
.item:active{transform:scale(.97) translateY(2px)}
.mapbox{perspective:800px;overflow:hidden}
.mapbox svg{transform:rotateX(14deg) scale(.96);transform-origin:50% 90%;transition:transform .4s;filter:drop-shadow(0 12px 8px rgba(80,40,20,.22))}
.mapbox.flat svg{transform:none;filter:none}
.mapbox circle[data-i]{filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.4))}
@media (prefers-reduced-motion:reduce){.sway,.bean,.leaf{animation:none}.stage,.item,.mapbox svg{transition:none}}
</style>
</head>

DATA.penginapan=RAW.p.map(function(r){return {n:r[0],lon:r[1],lat:r[2],s:r[3],m:rt(r[3]),g:""};});
DATA.kuliner=RAW.k.map(function(r){return {n:r[0],lon:r[3],lat:r[4],s:r[2],m:r[1]+" · "+rt(r[2]),g:/kopi/i.test(r[1])?"kopi":"lain"};});
DATA.warga=RAW.a.map(function(r){return {n:r[0],lon:r[4],lat:r[5],s:r[3],m:r[1]+" · "+rt(r[3]),g:r[2]};});
function rt(v){return v>0?'<span class="r">★ '+v.toFixed(1)+'</span>':'belum ada rating';}
var sn=-1,tab="wisata",sub="semua",q="",shown=12,sel=-1,cur=[];
function el(i){return document.getElementById(i);}
function T(){return TABS.filter(function(t){return t.id===tab;})[0];}
function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
var NG=RAW.b;NG.forEach(function(g){var x=[],y=[];g.r.forEach(function(r){r.forEach(function(p){x.push(p[0]);y.push(p[1]);});});g.x0=Math.min.apply(0,x);g.x1=Math.max.apply(0,x);g.y0=Math.min.apply(0,y);g.y1=Math.max.apply(0,y);});
function pip(g,lon,lat){var c=false;g.r.forEach(function(r){for(var i=0,j=r.length-1;i<r.length;j=i++){var a=r[i],b=r[j];if((a[1]>lat)!==(b[1]>lat)&&lon<(b[0]-a[0])*(lat-a[1])/(b[1]-a[1])+a[0])c=!c;}});return c;}
function nagOf(lon,lat){for(var i=0;i<NG.length;i++){var g=NG[i];if(lon>=g.x0&&lon<=g.x1&&lat>=g.y0&&lat<=g.y1&&pip(g,lon,lat))return i;}return -1;}
Object.keys(DATA).forEach(function(k){DATA[k].forEach(function(d){d.ng=nagOf(d.lon,d.lat);});});
function fview(i){var g=NG[i],w=(g.x1-g.x0)*1.3,h=(g.y1-g.y0)*1.3,cx=(g.x0+g.x1)/2,cy=(g.y0+g.y1)/2,a=320/212;if(w/h<a)w=h*a;else h=w/a;return {x0:cx-w/2,x1:cx+w/2,y0:cy-h/2,y1:cy+h/2};}
function drawTabs(){
  el("tabs").innerHTML=TABS.map(function(t){return '<button class="chip'+(t.id===tab?' on':'')+'" data-t="'+t.id+'">'+t.label+' ('+DATA[t.id].length+')</button>';}).join("");
  var cn=NG.map(function(){return 0;});DATA[tab].forEach(function(d){if(d.ng>-1)cn[d.ng]++;});
  el("foc").innerHTML='<select class="q" id="nag" aria-label="Pilih nagari" style="margin:0"><option value="-1">Seluruh Solok Selatan ('+DATA[tab].length+')</option>'+NG.map(function(g,i){return '<option value="'+i+'"'+(i===sn?' selected':'')+'>'+g.n+' – Kec. '+g.k+' ('+cn[i]+')</option>';}).join("")+'</select>';
  var s=T().subs;
  el("subs").innerHTML=s?s.map(function(x){return '<button class="chip'+(x[0]===sub?' on':'')+'" data-s="'+x[0]+'">'+x[1]+'</button>';}).join(""):"";
}
function filt(){
  var ql=q.toLowerCase();
  cur=DATA[tab].filter(function(d){return (sub==="semua"||d.g===sub)&&(sn<0||d.ng===sn)&&(!ql||d.n.toLowerCase().indexOf(ql)>-1);})
    .sort(function(a,b){return b.s-a.s;});
}
function drawMap(){
  var W=320,H=212,V=sn>-1?fview(sn):B,col=T().col,h="";
  function X(v){return (v-V.x0)/(V.x1-V.x0)*W;}function Y(v){return (V.y1-v)/(V.y1-V.y0)*H;}
  NG.forEach(function(g,gi){
    var d=g.r.map(function(r){return "M"+r.map(function(p){return X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1);}).join("L")+"Z";}).join("");
    var on=gi===sn;
    h+='<path data-g="'+gi+'" d="'+d+'" fill="var(--accent)" fill-opacity="'+(on?.14:.04)+'" stroke="var(--accent)" stroke-opacity="'+(on?1:.45)+'" stroke-width="'+(on?1.5:.6)+'"/>';
  });
  if(sn>-1){var g=NG[sn];h+='<text x="'+X((g.x0+g.x1)/2)+'" y="'+(Y(g.y1)-3)+'" font-size="8" text-anchor="middle" fill="var(--accent)" font-family="Lora,serif">'+g.n+'</text>';}
  cur.forEach(function(d,i){
    var x=X(d.lon),y=Y(d.lat);
    if(i===sel){h+='<circle cx="'+x+'" cy="'+y+'" r="9" fill="none" stroke="var(--accent)" stroke-width="2"/>';}
    h+='<circle data-i="'+i+'" cx="'+x+'" cy="'+y+'" r="'+(i===sel?5:3.5)+'" fill="'+col+'" fill-opacity=".85" stroke="var(--panel)" stroke-width="1"/>';
  });
  el("map").innerHTML=h;
  var c="";
  if(sel>-1&&cur[sel])c=cur[sel].n;
  else if(sn>-1)c=NG[sn].n+": "+TABS.map(function(t){return DATA[t.id].filter(function(d){return d.ng===sn;}).length+" "+t.label.toLowerCase();}).join(" · ");
  else c="Ketuk nagari di peta untuk memilih · "+cur.length+" titik";
  el("cap").textContent=c;
}
function drawList(){
  if(!cur.length){el("list").innerHTML='<div class="empty">Tidak ada hasil.</div>';el("more").hidden=true;return;}
  el("list").innerHTML=cur.slice(0,shown).map(function(d,i){
    return '<div class="item'+(i===sel?' sel':'')+'" data-i="'+i+'"><b>'+esc(d.n)+'</b><div class="m">'+d.m+'</div><a href="https://www.google.com/maps?q='+d.lat+','+d.lon+'" target="_blank" rel="noopener">Buka di Google Maps</a></div>';
  }).join("");
  el("more").hidden=cur.length<=shown;
}
function render(){drawTabs();filt();drawMap();drawList();el("tot").textContent=cur.length+" tempat";}
el("tabs").addEventListener("click",function(e){var t=e.target.getAttribute("data-t");if(t){tab=t;sub="semua";shown=12;sel=-1;render();}});
el("foc").addEventListener("change",function(e){sn=+e.target.value;shown=12;sel=-1;render();});
el("subs").addEventListener("click",function(e){var s=e.target.getAttribute("data-s");if(s){sub=s;shown=12;sel=-1;render();}});
el("q").addEventListener("input",function(e){q=e.target.value;shown=12;sel=-1;filt();drawMap();drawList();el("tot").textContent=cur.length+" tempat";});
el("more").addEventListener("click",function(){shown+=12;drawList();});
el("t3d").addEventListener("click",function(){var f=el("mapbox").classList.toggle("flat");this.textContent="Peta 3D: "+(f?"mati":"nyala");});
if(!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){
  var st=el("stage");
  var tilt=function(x,y){st.style.transform="rotateY("+(x*16).toFixed(1)+"deg) rotateX("+(-y*12).toFixed(1)+"deg)";};
  addEventListener("pointermove",function(e){tilt(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5);});
  addEventListener("deviceorientation",function(e){if(e.gamma==null||e.beta==null)return;tilt(Math.max(-.5,Math.min(.5,e.gamma/60)),Math.max(-.5,Math.min(.5,(e.beta-45)/60)));});
  el("list").addEventListener("pointermove",function(e){if(e.pointerType==="touch")return;var n=e.target.closest(".item");if(!n)return;var r=n.getBoundingClientRect();n.style.setProperty("--ry",(((e.clientX-r.left)/r.width-.5)*10).toFixed(1)+"deg");n.style.setProperty("--rx",(-((e.clientY-r.top)/r.height-.5)*10).toFixed(1)+"deg");});
  el("list").addEventListener("pointerout",function(e){var n=e.target.closest(".item");if(n){n.style.removeProperty("--rx");n.style.removeProperty("--ry");}});
}
el("list").addEventListener("click",function(e){
  if(e.target.tagName==="A")return;
  var n=e.target.closest(".item");if(!n)return;sel=+n.getAttribute("data-i");drawMap();drawList();
  el("map").scrollIntoView({block:"nearest",behavior:"smooth"});
});
el("map").addEventListener("click",function(e){
  var gi=e.target.getAttribute("data-g");if(gi!==null){sn=+gi;shown=12;sel=-1;render();return;}
  var i=e.target.getAttribute("data-i");if(i===null)return;sel=+i;if(sel>=shown)shown=sel+1;drawMap();drawList();
  var it=el("list").querySelector('[data-i="'+sel+'"]');if(it)it.scrollIntoView({block:"nearest",behavior:"smooth"});
});
render();
</script>
</body>
</html>
